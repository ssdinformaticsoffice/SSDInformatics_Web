name: Deploy SSD Informatics

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            echo "===== Starting SSD Informatics Deployment ====="

            cd /www/wwwroot/SSDInformatics_Web

            echo "===== Pulling latest code ====="
            git fetch origin
            git pull --ff-only origin main

            echo "===== Building Frontend ====="
            cd frontend
            npm ci
            npm run build

            echo "===== Building Admin Panel ====="
            cd ../AdminPanel
            npm ci
            npm run build

            echo "===== Updating Backend ====="
            cd ../backend
            npm ci

            echo "===== Reloading Backend ====="
            pm2 reload ssd-backend --update-env

            echo "===== Deployment Completed ====="